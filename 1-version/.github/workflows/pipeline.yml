name: MLOps End - to - End Pipeline

# 1. Cuando se ejecutara el pipeline (Tuberia)
on:
    push:
        branches: [ main ]
    pull_request: 
        branches: [ main ]
    # Programacion automatica (Cron job): Se ejecutara todos los lunes a las 6:00 AM UTC
    schedule:
        - cron: '0 6 * * 1'
    # Permite ejecutarlo manualmente desde la pestaña de Actions en GitHub
    workflow_dispatch:

jobs:
    run-mlops_pipeline:
        runs-on: ubuntu-latest

        steps:
        # Paso A: Descargar el codigo del repositorio
        - name: Checkout del codigo
          uses: actions/checkout@v3

        # Paso B: Configurar el entorno de Python en el servidor Github
        - name: Configurar Python 3.10
          uses: actions/setup-python@v4
          with: 
            python-version: '3.10' 

        # Paso C: Instalar las dependencias de Python
        - name: Instalar dependencias
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        # Paso D: Fase 1 - Ingesta de datos (Cliente Custom HTTP)
        - name: Ingesta de Datos financieros
          run: |
            python src/data/ingestasinyfinance.py

        # Paso E: Fase 2 - Ingenieria de caracteristicas (Feature Engineering)
        - name: Procesamiento y Creacion de Features
          run: |
            python src/data/features.py

        # Paso F: Fase 3 - Entrenamiento y Experiment Tracking con MLflow
        - name: Entrenamiento del modelo y Registro en MLflow
          run: |
            python src/models/train_mlflow.py

        # Paso G: Fase 4 - Prueba de humo de la API (Smoke Test)
        - name: Validar la ejecucion de la API
          run: |
            python -c "from src.models.predict_api import app; print('API de FastAPI cargada correctamente en CI/CD')"
